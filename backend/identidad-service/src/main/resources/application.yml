server:
  port: 8081

spring:
  application:
    name: identidad-service
  datasource:
    url: ${DB_IDENTIDAD_URL:jdbc:postgresql://localhost:5432/db_identidad}
    username: ${DB_IDENTIDAD_USER:postgres}
    password: ${DB_IDENTIDAD_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:tyronawilds}
    password: ${RABBITMQ_PASS:tyronawilds_secret}

app:
  auth:
    proveedores: ${AUTH_PROVEEDORES:local,google}
  jwt:
    secret: ${JWT_SECRET:TyronaWildsSantaMartaCaribeSierraNevadaSecretKeyForHS256Auth2026!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  messaging:
    exchange: tyronawilds.eventos.exchange
    auditoria-queue: auditoria.q
    auditoria-routing-key: seguridad.acceso.denegado
