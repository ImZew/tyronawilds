server:
  port: 8084

spring:
  application:
    name: recomendacion-service
  datasource:
    url: ${DB_RECOMENDACION_URL:jdbc:postgresql://localhost:5432/db_recomendacion}
    username: ${DB_RECOMENDACION_USER:postgres}
    password: ${DB_RECOMENDACION_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  recomendacion:
    nivel: ${RECOMENDACION_NIVEL:PERSONALIZADO}
  services:
    oferta-url: ${OFERTA_SERVICE_URL:http://localhost:8082}
    integracion-url: ${INTEGRACION_SERVICE_URL:http://localhost:8085}
    timeout-ms: 2000

resilience4j:
  circuitbreaker:
    instances:
      contextoTerritorialClient:
        slidingWindowSize: 5
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
