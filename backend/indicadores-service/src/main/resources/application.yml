server:
  port: 8086

spring:
  application:
    name: indicadores-service
  datasource:
    url: ${DB_INDICADORES_URL:jdbc:postgresql://localhost:5432/db_indicadores}
    username: ${DB_INDICADORES_USER:postgres}
    password: ${DB_INDICADORES_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

app:
  messaging:
    exchange: tyronawilds.events
    indicadores-queue: indicadores.capacidad.q
    reserva-confirmada-routing-key: reservas.confirmada
