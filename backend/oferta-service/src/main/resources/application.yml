server:
  port: 8082

spring:
  application:
    name: oferta-service
  datasource:
    url: ${DB_OFERTA_URL:jdbc:postgresql://localhost:5432/db_oferta}
    username: ${DB_OFERTA_USER:postgres}
    password: ${DB_OFERTA_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

app:
  cache:
    ttl-seconds: 300
  messaging:
    exchange: tyronawilds.events
    auditoria-queue: auditoria.q
    auditoria-routing-key: seguridad.acceso.denegado
